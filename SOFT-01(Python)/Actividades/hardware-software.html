<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio: Hardware o software</title>
    <!-- Font Awesome 6 (CDN) – no es un estilo, es una librería de iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div
        style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;  min-height: 80vh; display: flex; align-items: center; justify-content: center; margin: 0;">

        <!-- ============ TARJETA PRINCIPAL ============ -->
        <section aria-labelledby="ejercicio1"
            style="background: #ffffff; border-radius: 20px; padding: 28px 30px; max-width: 900px; width: 100%; box-shadow: 0 8px 30px rgba(22, 74, 152, 0.12); border-left: 6px solid #164a98; transition: box-shadow 0.3s ease;">

            <!-- ENCABEZADO CON ICONO -->
            <div
                style="display: flex; align-items: center; gap: 14px; margin-bottom: 18px; border-bottom: 3px solid #9CC8FF; padding-bottom: 14px; flex-wrap: wrap;">
                <span
                    style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: linear-gradient(135deg, #006AEA, #164a98); border-radius: 12px; color: #ffffff; font-size: 24px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0, 106, 234, 0.35);"
                    aria-hidden="true">
                    <i class="fa-solid fa-pen-to-square"></i>
                </span>
                <h3 id="ejercicio1"
                    style="margin: 0; color: #164a98; font-size: 26px; font-weight: 700; letter-spacing: -0.3px;">
                    Ejercicio 1: Hardware o software
                </h3>
            </div>

            <!-- INSTRUCCIONES -->
            <p
                style="background: #eef5ff; border-left: 5px solid #006AEA; padding: 16px 18px; margin: 0 0 22px 0; border-radius: 8px; color: #1a3a6b; font-size: 16px; line-height: 1.5;  gap: 10px;">
                <span>
                    <strong>Instrucciones:</strong> Clasifique cada elemento como
                    <strong>Hardware</strong> o <strong>Software</strong>.
                    Después seleccione <strong>Comprobar respuestas</strong>.
                </span>
            </p>

            <!-- GRID DE PREGUNTAS -->
            <div
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 22px;">

                <!-- Ítem 1 -->
                <div
                    style="border: 2px solid #c8d1df; border-radius: 12px; padding: 16px; background: #fafcff; transition: border-color 0.25s ease, box-shadow 0.25s ease;">
                    <label for="hardware1"
                        style="display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; color: #1c3b64; font-size: 16px;">
                        <i class="fa-solid fa-keyboard" aria-hidden="true" style="color: #712c86; font-size: 16px;"></i>
                        Teclado
                    </label>
                    <select id="hardware1"
                        style="width: 100%; padding: 11px 12px; border: 2px solid #8b99ad; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1c3b64; background: #ffffff; cursor: pointer; transition: border-color 0.25s ease, box-shadow 0.25s ease;"
                        aria-label="Clasificar Teclado">
                        <option value="">Seleccione...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </div>

                <!-- Ítem 2 -->
                <div
                    style="border: 2px solid #c8d1df; border-radius: 12px; padding: 16px; background: #fafcff; transition: border-color 0.25s ease, box-shadow 0.25s ease;">
                    <label for="hardware2"
                        style="display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; color: #1c3b64; font-size: 16px;">
                        <i class="fa-brands fa-windows" aria-hidden="true" style="color: #712c86; font-size: 16px;"></i>
                        Windows
                    </label>
                    <select id="hardware2"
                        style="width: 100%; padding: 11px 12px; border: 2px solid #8b99ad; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1c3b64; background: #ffffff; cursor: pointer; transition: border-color 0.25s ease, box-shadow 0.25s ease;"
                        aria-label="Clasificar Windows">
                        <option value="">Seleccione...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </div>

                <!-- Ítem 3 -->
                <div
                    style="border: 2px solid #c8d1df; border-radius: 12px; padding: 16px; background: #fafcff; transition: border-color 0.25s ease, box-shadow 0.25s ease;">
                    <label for="hardware3"
                        style="display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; color: #1c3b64; font-size: 16px;">
                        <i class="fa-solid fa-microchip" aria-hidden="true"
                            style="color: #712c86; font-size: 16px;"></i> Procesador
                    </label>
                    <select id="hardware3"
                        style="width: 100%; padding: 11px 12px; border: 2px solid #8b99ad; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1c3b64; background: #ffffff; cursor: pointer; transition: border-color 0.25s ease, box-shadow 0.25s ease;"
                        aria-label="Clasificar Procesador">
                        <option value="">Seleccione...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </div>

                <!-- Ítem 4 -->
                <div
                    style="border: 2px solid #c8d1df; border-radius: 12px; padding: 16px; background: #fafcff; transition: border-color 0.25s ease, box-shadow 0.25s ease;">
                    <label for="hardware4"
                        style="display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; color: #1c3b64; font-size: 16px;">
                        <i class="fa-brands fa-chrome" aria-hidden="true" style="color: #712c86; font-size: 16px;"></i>
                        Google Chrome
                    </label>
                    <select id="hardware4"
                        style="width: 100%; padding: 11px 12px; border: 2px solid #8b99ad; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1c3b64; background: #ffffff; cursor: pointer; transition: border-color 0.25s ease, box-shadow 0.25s ease;"
                        aria-label="Clasificar Google Chrome">
                        <option value="">Seleccione...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </div>

                <!-- Ítem 5 -->
                <div
                    style="border: 2px solid #c8d1df; border-radius: 12px; padding: 16px; background: #fafcff; transition: border-color 0.25s ease, box-shadow 0.25s ease;">
                    <label for="hardware5"
                        style="display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; color: #1c3b64; font-size: 16px;">
                        <i class="fa-solid fa-memory" aria-hidden="true" style="color: #712c86; font-size: 16px;"></i>
                        Memoria RAM
                    </label>
                    <select id="hardware5"
                        style="width: 100%; padding: 11px 12px; border: 2px solid #8b99ad; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1c3b64; background: #ffffff; cursor: pointer; transition: border-color 0.25s ease, box-shadow 0.25s ease;"
                        aria-label="Clasificar Memoria RAM">
                        <option value="">Seleccione...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </div>

                <!-- Ítem 6 -->
                <div
                    style="border: 2px solid #c8d1df; border-radius: 12px; padding: 16px; background: #fafcff; transition: border-color 0.25s ease, box-shadow 0.25s ease;">
                    <label for="hardware6"
                        style="display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; color: #1c3b64; font-size: 16px;">
                        <i class="fa-solid fa-code" aria-hidden="true" style="color: #712c86; font-size: 16px;"></i>
                        Visual Studio Code
                    </label>
                    <select id="hardware6"
                        style="width: 100%; padding: 11px 12px; border: 2px solid #8b99ad; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1c3b64; background: #ffffff; cursor: pointer; transition: border-color 0.25s ease, box-shadow 0.25s ease;"
                        aria-label="Clasificar Visual Studio Code">
                        <option value="">Seleccione...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </div>

                <!-- Ítem 7 -->
                <div
                    style="border: 2px solid #c8d1df; border-radius: 12px; padding: 16px; background: #fafcff; transition: border-color 0.25s ease, box-shadow 0.25s ease;">
                    <label for="hardware7"
                        style="display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; color: #1c3b64; font-size: 16px;">
                        <i class="fa-solid fa-desktop" aria-hidden="true" style="color: #712c86; font-size: 16px;"></i>
                        Monitor
                    </label>
                    <select id="hardware7"
                        style="width: 100%; padding: 11px 12px; border: 2px solid #8b99ad; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1c3b64; background: #ffffff; cursor: pointer; transition: border-color 0.25s ease, box-shadow 0.25s ease;"
                        aria-label="Clasificar Monitor">
                        <option value="">Seleccione...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </div>

                <!-- Ítem 8 -->
                <div
                    style="border: 2px solid #c8d1df; border-radius: 12px; padding: 16px; background: #fafcff; transition: border-color 0.25s ease, box-shadow 0.25s ease;">
                    <label for="hardware8"
                        style="display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; color: #1c3b64; font-size: 16px;">
                        <i class="fa-solid fa-hard-drive" aria-hidden="true"
                            style="color: #712c86; font-size: 16px;"></i> SSD
                    </label>
                    <select id="hardware8"
                        style="width: 100%; padding: 11px 12px; border: 2px solid #8b99ad; border-radius: 8px; font-size: 15px; font-family: inherit; color: #1c3b64; background: #ffffff; cursor: pointer; transition: border-color 0.25s ease, box-shadow 0.25s ease;"
                        aria-label="Clasificar SSD">
                        <option value="">Seleccione...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </div>

            </div>

            <!-- BOTÓN COMPROBAR -->
            <button id="btn-comprobar-hardware" type="button"
                style="display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; background: linear-gradient(135deg, #164a98, #006AEA); color: #ffffff; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.25s ease; box-shadow: 0 4px 14px rgba(22, 74, 152, 0.35); letter-spacing: 0.3px;">
                <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                Comprobar respuestas
            </button>

            <!-- RESULTADO (inicialmente oculto) -->
            <div id="resultadoHardware" role="status" aria-live="polite"
                style="margin-top: 18px; padding: 16px 18px; font-weight: 700; font-size: 16px; border-radius: 10px; display: none; align-items: center; gap: 10px; transition: all 0.3s ease;">
            </div>

        </section>

        <script>
            (function () {
                const boton = document.getElementById('btn-comprobar-hardware');
                const resultado = document.getElementById('resultadoHardware');

                if (!boton || !resultado) {
                    console.warn('Elementos no encontrados');
                    return;
                }

                // Respuestas correctas (editable para otros ejercicios)
                const respuestasCorrectas = {
                    hardware1: "hardware", // Teclado
                    hardware2: "software", // Windows
                    hardware3: "hardware", // Procesador
                    hardware4: "software", // Google Chrome
                    hardware5: "hardware", // Memoria RAM
                    hardware6: "software", // Visual Studio Code
                    hardware7: "hardware", // Monitor
                    hardware8: "hardware"  // SSD
                };

                const totalPreguntas = Object.keys(respuestasCorrectas).length;

                // Función para mostrar el resultado con estilos inline
                function mostrarResultado(correctas) {
                    // Mostrar el contenedor
                    resultado.style.display = 'flex';

                    // Limpiar estilos previos de colores
                    resultado.style.background = '';
                    resultado.style.color = '';
                    resultado.style.border = '';

                    if (correctas === totalPreguntas) {
                        // Éxito total
                        resultado.style.background = '#e6f7f5';
                        resultado.style.color = '#006b66';
                        resultado.style.border = '2px solid #00928d';
                        resultado.innerHTML =
                            '<i class="fa-solid fa-circle-check" aria-hidden="true"></i> ' +
                            '¡Excelente! Todas las respuestas son correctas.';
                    } else {
                        // Error parcial o total
                        resultado.style.background = '#fff3e6';
                        resultado.style.color = '#a34418';
                        resultado.style.border = '2px solid #C7AC19';
                        resultado.innerHTML =
                            '<i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> ' +
                            'Obtuvo <strong>' + correctas + '</strong> de <strong>' + totalPreguntas +
                            '</strong> respuestas correctas. Revise sus respuestas e inténtelo nuevamente.';
                    }
                }

                // Evento del botón
                boton.addEventListener('click', function () {
                    let correctas = 0;

                    // Comparar respuestas
                    Object.keys(respuestasCorrectas).forEach(function (id) {
                        const campo = document.getElementById(id);
                        if (campo && campo.value === respuestasCorrectas[id]) {
                            correctas++;
                        }
                    });

                    // Mostrar resultado
                    mostrarResultado(correctas);

                    // Resaltar selects incorrectos (feedback visual)
                    Object.keys(respuestasCorrectas).forEach(function (id) {
                        const campo = document.getElementById(id);
                        if (campo) {
                            if (campo.value !== respuestasCorrectas[id]) {
                                campo.style.borderColor = '#c81f66';
                                campo.style.backgroundColor = '#fff5f7';
                            } else {
                                campo.style.borderColor = '#00928d';
                                campo.style.backgroundColor = '#f0faf9';
                            }
                        }
                    });
                });

                // Resetear estilos al cambiar una opción
                Object.keys(respuestasCorrectas).forEach(function (id) {
                    const campo = document.getElementById(id);
                    if (campo) {
                        campo.addEventListener('change', function () {
                            campo.style.borderColor = '#8b99ad';
                            campo.style.backgroundColor = '#ffffff';
                        });
                    }
                });

            })();
        </script>

    </div>


</body>

</html>
